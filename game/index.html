<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SALERO — Nasi Padang Rush</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c1a14;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    justify-content: flex-start; /* canvas must start at y=0 even on short screens */
    font-family: system-ui, sans-serif;
  }
  #wrap {
    width: min(1280px, 100vw);
    aspect-ratio: 1280 / 720;
  }
  #hint {
    color: #9ab8a6;
    font-size: 13px;
    text-align: center;
    padding: 10px 16px 0;
    line-height: 1.5;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">SALERO — Nasi Padang Rush &nbsp;•&nbsp; WASD jalan, E ambil / potong / masak / sajikan, klik stasiun untuk jalan ke sana, P jeda, M bisu</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
